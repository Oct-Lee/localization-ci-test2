name: Gemini Localization Review


on:
  push:
    branches:
      - main


concurrency:
  group: gemini-localization-review-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read


jobs:

  gemini-review:

    runs-on: ubuntu-latest

    timeout-minutes: 5


    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2


      - name: Get changed diff
        run: |

          git diff HEAD~1 HEAD > pr.diff

          cat pr.diff



      - name: Install dependency

        run: |

          pip install requests



      - name: Run Gemini Review

        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python3 scripts/gemini_review.py



      - name: Show Result

        run: |

          echo "## 🤖 Gemini Localization Review" \
          >> $GITHUB_STEP_SUMMARY


          cat gemini-result.md \
          >> $GITHUB_STEP_SUMMARY