name: Gemini Localization Review

on:
  push:
    branches:
      - main


permissions:
  contents: read


jobs:
  gemini-review:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2


      - name: Get changed diff
        run: |
          git diff HEAD~1 HEAD > pr.diff

          echo "========== DIFF =========="
          cat pr.diff


      - name: Call Gemini API

        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python3 <<'EOF'

          import os
          import requests


          api_key=os.environ["GEMINI_API_KEY"]


          diff=open(
              "pr.diff",
              encoding="utf-8"
          ).read()


          prompt=f"""
You are a localization quality reviewer.

Check this code diff:

1. English grammar
2. English spelling
3. Chinese wording
4. Portuguese wording
5. User-facing message quality


Return:

Problem:
Reason:
Suggestion:


Diff:

{diff}
"""


          url=(
          "https://generativelanguage.googleapis.com/"
          "v1beta/models/"
          "gemini-2.5-flash:generateContent"
          f"?key={api_key}"
          )


          response=requests.post(
              url,
              json={
                "contents":[
                  {
                    "parts":[
                      {
                        "text":prompt
                      }
                    ]
                  }
                ]
              }
          )


          response.raise_for_status()


          result=response.json()


          text=(
              result["candidates"][0]
              ["content"]
              ["parts"][0]
              ["text"]
          )


          print(text)


          open(
              "gemini-result.md",
              "w",
              encoding="utf-8"
          ).write(text)


          EOF


      - name: Show Gemini Result

        run: |
          cat gemini-result.md >> $GITHUB_STEP_SUMMARY
