name: Gemini Localization Review

on:
  push:
    branches:
      - main

permissions:
  contents: read


jobs:

  gemini-review:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2


      - name: Get changed diff
        run: |
          git diff HEAD~1 HEAD > pr.diff
          echo "====== DIFF ======"
          cat pr.diff


      - name: Call Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          pip install requests

          python3 <<'PYTHON'

          import os
          import requests


          key = os.environ["GEMINI_API_KEY"]


          with open(
              "pr.diff",
              encoding="utf-8"
          ) as f:
              diff = f.read()


          prompt = """
          Review this localization text.

          Check:

          1. English grammar
          2. English spelling
          3. Chinese wording
          4. Portuguese wording

          Diff:

          """ + diff


          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/"
              "gemini-2.0-flash:generateContent"
              f"?key={key}"
          )


          r = requests.post(
              url,
              json={
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ]
              },
              timeout=60
          )


          r.raise_for_status()


          result = r.json()


          output = (
              result["candidates"][0]
              ["content"]
              ["parts"][0]
              ["text"]
          )


          print(output)


          with open(
              "gemini-result.md",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(output)


          PYTHON


      - name: Show Gemini Result

        run: |
          cat gemini-result.md >> $GITHUB_STEP_SUMMARY
