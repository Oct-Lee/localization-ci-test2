name: Gemini Localization Review


on:
  push:
    branches:
      - main


permissions:
  contents: read


jobs:

  gemini-review:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2



      - name: Get changed diff
        run: |

          git diff HEAD~1 HEAD > pr.diff

          echo "========== DIFF =========="

          cat pr.diff



      - name: Call Gemini API

        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}


        run: |

          pip install requests


          python3 <<'PYTHON'


          import os
          import time
          import requests



          api_key = os.environ.get(
              "GEMINI_API_KEY"
          )


          if not api_key:
              raise Exception(
                  "GEMINI_API_KEY is missing"
              )



          with open(
              "pr.diff",
              encoding="utf-8"
          ) as f:

              diff = f.read()



          # Limit input size to avoid token quota issue

          if len(diff) > 8000:

              diff = diff[:8000]

              print(
                  "Diff truncated to 8000 chars"
              )



          prompt = f"""
You are a localization quality reviewer.

Review the following code diff.

Check:

1. English spelling
2. English grammar
3. Chinese wording quality
4. Portuguese wording quality
5. User-facing message professionalism


Return:

## Problems

- Location
- Issue
- Reason
- Suggested correction


Code diff:

{diff}
"""



          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/"
              "gemini-2.0-flash:generateContent"
              f"?key={api_key}"
          )



          response = None



          # Retry for quota / rate limit

          for retry in range(3):

              print(
                  f"Gemini request attempt {retry + 1}"
              )


              response = requests.post(
                  url,
                  json={
                      "contents": [
                          {
                              "parts": [
                                  {
                                      "text": prompt
                                  }
                              ]
                          }
                      ]
                  },
                  timeout=60
              )


              if response.status_code == 200:

                  break



              print(
                  "Gemini API error:"
              )

              print(
                  response.text
              )


              if response.status_code == 429:

                  wait_time = (
                      10 * (retry + 1)
                  )

                  print(
                      f"Rate limited. "
                      f"Retry after {wait_time}s"
                  )

                  time.sleep(
                      wait_time
                  )

              else:

                  break



          if response.status_code != 200:


              raise Exception(
                  "Gemini API failed:\n"
                  + response.text
              )



          result = response.json()



          try:

              output = (
                  result["candidates"][0]
                  ["content"]
                  ["parts"][0]
                  ["text"]
              )


          except Exception:


              print(
                  "Unexpected Gemini response:"
              )

              print(
                  result
              )

              raise



          print(
              output
          )



          with open(
              "gemini-result.md",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  output
              )


          PYTHON




      - name: Show Gemini Result

        run: |

          echo "## 🤖 Gemini Localization Review" \
          >> $GITHUB_STEP_SUMMARY


          cat gemini-result.md \
          >> $GITHUB_STEP_SUMMARY
