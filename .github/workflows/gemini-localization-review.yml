name: Gemini Localization Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write


jobs:
  gemini-review:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Get PR diff
        id: diff
        run: |
          git diff \
          ${{ github.event.pull_request.base.sha }} \
          ${{ github.event.pull_request.head.sha }} \
          > pr.diff


      - name: Call Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python3 <<'EOF'

          import os
          import requests
          import json


          api_key=os.environ["GEMINI_API_KEY"]


          diff=open(
              "pr.diff",
              encoding="utf-8"
          ).read()


          prompt=f"""
          You are a localization quality reviewer.

          Review the following GitHub PR diff.

          Check:

          1. English grammar
          2. English spelling
          3. Chinese wording
          4. Portuguese wording
          5. User-facing message quality


          Provide:

          - Problem
          - Reason
          - Suggested correction


          PR diff:

          {diff}

          """


          url=(
          "https://generativelanguage.googleapis.com/"
          "v1beta/models/"
          "gemini-2.5-flash:generateContent"
          f"?key={api_key}"
          )


          response=requests.post(
              url,
              json={
                "contents":[
                  {
                    "parts":[
                      {
                       "text":prompt
                      }
                    ]
                  }
                ]
              }
          )


          result=response.json()


          text=result[
              "candidates"
          ][0][
              "content"
          ][
              "parts"
          ][0][
              "text"
          ]


          open(
              "gemini-result.md",
              "w",
              encoding="utf-8"
          ).write(text)


          print(text)

          EOF


      - name: Comment PR

        uses: actions/github-script@v7

        with:

          script: |

            const fs=require('fs');

            const body=
              fs.readFileSync(
                'gemini-result.md',
                'utf8'
              );


            github.rest.issues.createComment({

              owner:
                context.repo.owner,

              repo:
                context.repo.repo,

              issue_number:
                context.issue.number,

              body:
                "## 🤖 Gemini Localization Review\n\n"
                + body

            });
