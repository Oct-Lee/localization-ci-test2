name: Localization Quality Gate


on:

  push:

    branches:
      - main


  workflow_dispatch:



permissions:

  contents: read



jobs:


  localization-check:


    name: ${{ matrix.tool }}

    runs-on: ubuntu-latest


    strategy:

      fail-fast: false

      matrix:

        tool:

          - cspell

          - languagetool



    steps:


      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      ####################################
      #
      # CSpell
      #
      ####################################


      - name: Install cspell

        if: matrix.tool == 'cspell'

        run: |

          npm install -g cspell



      - name: Run cspell

        if: matrix.tool == 'cspell'

        run: |


          cspell \
          "**/*.{py,sh,md,json,yaml,yml}" \
          --config .cspell.json



      ####################################
      #
      # LanguageTool
      #
      ####################################


      - name: Install LanguageTool

        if: matrix.tool == 'languagetool'

        run: |


          sudo apt update

          sudo apt install -y \
          default-jre


          wget -q \
          https://languagetool.org/download/LanguageTool-stable.zip


          unzip -q \
          LanguageTool-stable.zip



      - name: Run LanguageTool

        if: matrix.tool == 'languagetool'

        run: |


          python3 scripts/languagetool_check.py