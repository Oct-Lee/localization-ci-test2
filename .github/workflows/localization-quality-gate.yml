name: Localization Quality Gate


on:

  push:
    branches:
      - main

  workflow_dispatch:



permissions:

  contents: read



jobs:


  localization-check:


    name: ${{ matrix.check }}

    runs-on: ubuntu-latest


    strategy:

      fail-fast: false

      matrix:

        check:

          - cspell

          - languagetool



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      ####################################
      # Spell Check
      ####################################

      - name: Install cspell

        if: matrix.check == 'cspell'

        run: |

          npm install -g \
          cspell \
          @cspell/dict-en-us \
          @cspell/dict-pt-br \
          @cspell/dict-zh



      - name: Run cspell

        if: matrix.check == 'cspell'

        run: |


          cspell \
          "**/*.{py,sh,cpp,h,json,yaml,md}" \
          --config .cspell.json



      ####################################
      # Grammar Check
      ####################################

      - name: Install LanguageTool

        if: matrix.check == 'languagetool'

        run: |


          sudo apt update

          sudo apt install -y \
          default-jre



          wget -q \
          https://languagetool.org/download/LanguageTool-stable.zip


          unzip -q LanguageTool-stable.zip



      - name: Run LanguageTool

        if: matrix.check == 'languagetool'

        run: |


          python3 scripts/languagetool_check.py