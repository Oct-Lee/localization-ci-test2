name: Localization Quality Gate


on:

  push:

    branches:

      - main


permissions:

  contents: read



jobs:


  ####################################
  # Spell Check
  ####################################

  spell-check:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      - name: Install cspell

        run: |

          npm install -g cspell



      - name: Get changed files

        id: files

        run: |

          git diff \
          --name-only \
          ${{ github.event.before }} \
          ${{ github.sha }} \
          > changed_files.txt


          cat changed_files.txt



      - name: Run cspell


        run: |


          FILES=$(cat changed_files.txt | \
          grep -E '\.(py|sh|cpp|hpp|md|json|yaml|yml)$' || true)



          if [ -z "$FILES" ]; then

              echo "No files to check"

              exit 0

          fi



          cspell \
          --config .cspell.json \
          $FILES





  ####################################
  # Grammar Check
  ####################################


  grammar-check:


    runs-on: ubuntu-latest



    steps:


      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      - name: Install dependency

        run: |

          pip install requests



      - name: Run LanguageTool

        run: |

          python3 scripts/languagetool_check.py